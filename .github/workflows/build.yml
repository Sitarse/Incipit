# Incipit sur Windows, macOS et Linux : à chaque envoi, les tests et l'essai de démarrage de la vraie appli sur les trois
# systèmes, puis l'installateur de chacun (Windows .exe, macOS .dmg Intel et Apple Silicon, Linux .AppImage et .deb).
# Un tag « v… » publie ces fichiers dans une release.
name: build

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: windows-latest, name: windows }
          - { os: macos-latest, name: macos }
          - { os: ubuntu-latest, name: linux }
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      # uv lance le moteur Python (les tests le trouvent dans le PATH ; l'installateur embarque le sien : scripts/fetch-uv.js)
      - uses: astral-sh/setup-uv@v5

      - run: npm ci
      # npm bloque les scripts d'installation : le binaire d'Electron se télécharge à part
      - run: node node_modules/electron/install.js

      - run: npm test
      - name: Moteur Python (auto-test)
        run: uv run --script src/modules/cours/engine/generator.py --self-test

      - name: Essai de démarrage (Linux, écran virtuel)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y xvfb
          xvfb-run -a npm run smoke
      - name: Essai de démarrage
        if: runner.os != 'Linux'
        run: npm run smoke

      - name: Installateur
        run: npm run dist
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'

      - uses: actions/upload-artifact@v4
        with:
          name: incipit-${{ matrix.name }}
          if-no-files-found: error
          path: |
            dist/*.exe
            dist/*.dmg
            dist/*.AppImage
            dist/*.deb

  release:
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - uses: softprops/action-gh-release@v2
        with:
          files: dist/*
