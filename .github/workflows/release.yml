name: Release Incipit

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build-windows:
    name: Build Windows
    runs-on: windows-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5

      - name: Download Windows uv binary
        run: |
          $url = "https://github.com/astral-sh/uv/releases/latest/download/uv-x86_64-pc-windows-msvc.zip"
          $out = "packaging/vendor/windows/uv.zip"
          $dest = "packaging/vendor/windows/uv.exe"
          if (-not (Test-Path $dest)) {
            New-Item -ItemType Directory -Force -Path (Split-Path $dest) | Out-Null
            Invoke-WebRequest -Uri $url -OutFile $out
            Expand-Archive $out "packaging/vendor/windows" -Force
          }

      - name: Build Windows executable
        run: |
          uv run --with pyinstaller --with flask --with pywebview pyinstaller app.py `
            --name Incipit --onedir --windowed --noconfirm `
            --icon "${{ github.workspace }}\frontend\logo.ico" `
            --distpath dist --workpath build\windows --specpath packaging `
            --exclude-module pkg_resources `
            --add-data "${{ github.workspace }}\frontend;frontend" `
            --add-data "${{ github.workspace }}\generator.py;." `
            --add-data "${{ github.workspace }}\md2pdf.py;." `
            --add-data "${{ github.workspace }}\exercices.py;." `
            --add-data "${{ github.workspace }}\config\keys.env.example;config" `
            --add-binary "${{ github.workspace }}\packaging\vendor\windows\uv.exe;."

      - name: Zip Windows artifact
        run: |
          Compress-Archive -Path "dist\Incipit\*" -DestinationPath "dist\Incipit-windows.zip"

      - name: Upload Windows artifact
        uses: actions/upload-artifact@v4
        with:
          name: Incipit-windows
          path: dist/Incipit-windows.zip
          retention-days: 1

  build-linux:
    name: Build Linux
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev libayatana-appindicator3-dev librsvg2-dev

      - name: Download Linux uv binary
        run: |
          mkdir -p packaging/vendor/linux
          curl -fsSL -o packaging/vendor/linux/uv.tar.gz \
            https://github.com/astral-sh/uv/releases/latest/download/uv-x86_64-unknown-linux-gnu.tar.gz
          tar -xzf packaging/vendor/linux/uv.tar.gz -C packaging/vendor/linux --strip-components=1
          chmod +x packaging/vendor/linux/uv

      - name: Build Linux executable
        run: |
          uv run --with pyinstaller --with flask --with "pywebview[qt]" pyinstaller app.py \
            --name Incipit --onedir --windowed --noconfirm \
            --distpath dist --workpath build/linux --specpath packaging \
            --exclude-module pkg_resources \
            --add-data "${{ github.workspace }}/frontend:frontend" \
            --add-data "${{ github.workspace }}/generator.py:." \
            --add-data "${{ github.workspace }}/md2pdf.py:." \
            --add-data "${{ github.workspace }}/exercices.py:." \
            --add-data "${{ github.workspace }}/config/keys.env.example:config" \
            --add-binary "${{ github.workspace }}/packaging/vendor/linux/uv:."

      - name: Copy desktop-integration scripts
        run: |
          cp packaging/install_linux.sh packaging/uninstall_linux.sh dist/
          chmod +x dist/install_linux.sh dist/uninstall_linux.sh

      - name: Zip Linux artifact
        run: |
          cd dist
          tar -czf Incipit-linux.tar.gz Incipit install_linux.sh uninstall_linux.sh

      - name: Upload Linux artifact
        uses: actions/upload-artifact@v4
        with:
          name: Incipit-linux
          path: dist/Incipit-linux.tar.gz
          retention-days: 1

  build-macos:
    name: Build macOS
    runs-on: macos-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5

      - name: Download macOS uv binary
        run: |
          mkdir -p packaging/vendor/macos
          arch=$(uname -m)
          [ "$arch" = "arm64" ] && cible="aarch64-apple-darwin" || cible="x86_64-apple-darwin"
          curl -fsSL -o packaging/vendor/macos/uv.tar.gz \
            "https://github.com/astral-sh/uv/releases/latest/download/uv-${cible}.tar.gz"
          tar -xzf packaging/vendor/macos/uv.tar.gz -C packaging/vendor/macos --strip-components=1
          chmod +x packaging/vendor/macos/uv

      - name: Create .icns icon
        run: |
          icns="packaging/vendor/macos/logo.icns"
          if [ ! -f "$icns" ]; then
            iconset="packaging/vendor/macos/logo.iconset"
            mkdir -p "$iconset"
            for taille in 16 32 64 128 256 512; do
              sips -z $taille $taille ${{ github.workspace }}/frontend/logo.png --out "$iconset/icon_${taille}x${taille}.png" >/dev/null
              double=$((taille * 2))
              sips -z $double $double ${{ github.workspace }}/frontend/logo.png --out "$iconset/icon_${taille}x${taille}@2x.png" >/dev/null
            done
            iconutil -c icns "$iconset" -o "$icns"
          fi

      - name: Build macOS app bundle
        run: |
          uv run --with pyinstaller --with flask --with pywebview pyinstaller app.py \
            --name Incipit --onedir --windowed --noconfirm \
            --icon "${{ github.workspace }}/packaging/vendor/macos/logo.icns" \
            --distpath dist --workpath build/macos --specpath packaging \
            --exclude-module pkg_resources \
            --add-data "${{ github.workspace }}/frontend:frontend" \
            --add-data "${{ github.workspace }}/generator.py:." \
            --add-data "${{ github.workspace }}/md2pdf.py:." \
            --add-data "${{ github.workspace }}/exercices.py:." \
            --add-data "${{ github.workspace }}/config/keys.env.example:config" \
            --add-binary "${{ github.workspace }}/packaging/vendor/macos/uv:."

      - name: Zip macOS artifact
        run: |
          cd dist
          zip -r Incipit-macos.zip Incipit.app

      - name: Upload macOS artifact
        uses: actions/upload-artifact@v4
        with:
          name: Incipit-macos
          path: dist/Incipit-macos.zip
          retention-days: 1

  release:
    name: Create Release
    needs: [build-windows, build-linux, build-macos]
    runs-on: ubuntu-latest
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            artifacts/Incipit-windows.zip
            artifacts/Incipit-linux.tar.gz
            artifacts/Incipit-macos.zip
          generate_release_notes: false
          body: |
            ## Incipit ${{ github.ref_name }}

            Three standalone executables — Windows, Linux, macOS. Download your platform's archive, extract, and run. No installation needed.

            ### What's inside
            - **Incipit-windows.zip** → folder with `Incipit.exe` + `uv.exe`
            - **Incipit-linux.tar.gz** → `Incipit/` folder + `install_linux.sh` (adds Incipit to your application menu — run once with `sh install_linux.sh`; `uninstall_linux.sh` removes it again). Without it you can still launch directly via `Incipit/Incipit`.
            - **Incipit-macos.zip** → `Incipit.app` bundle
            
            ### Requirements
            - **Executable**: none — Python, uv, deps bundled. Chrome/Edge for PDF (pre-installed on Win/macOS, `chromium` on Linux).
            - **Optional**: [Obsidian](https://obsidian.md/download) to group courses in a vault.
            
            ### Engines
            - **free (NVIDIA NIM)** — free, needs `nvapi-…` key
            - **claude-cli** — needs Claude Code subscription + `claude` CLI
            
            See [README](https://github.com/Sitarse/Incipit#readme) for full docs.