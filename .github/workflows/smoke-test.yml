name: Smoke test build (temporaire)

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['.github/workflows/smoke-test.yml']

permissions:
  contents: write

jobs:
  linux:
    name: Build + lancer sur Linux
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5

      - name: Dependances runtime pour Qt headless
        run: |
          sudo apt-get update
          sudo apt-get install -y xvfb libgl1 libegl1 \
            libxcb1 libxcb-cursor0 libxcb-icccm4 libxcb-image0 libxcb-keysyms1 \
            libxcb-randr0 libxcb-render-util0 libxcb-shape0 libxcb-xfixes0 \
            libxcb-xinerama0 libxkbcommon-x11-0

      - name: Build (packaging/build_linux.sh)
        run: sh packaging/build_linux.sh

      - name: Lancer et verifier
        run: |
          set -e
          exec > /tmp/verify.log 2>&1
          xvfb-run -a -- dist/Incipit/Incipit > /tmp/stdout.log 2>&1 &
          sleep 10

          pid=$(pgrep -x Incipit | head -1)
          log="dist/Incipit/_internal/logs/app.log"
          if [ -z "$pid" ]; then
            echo "Processus Incipit introuvable apres le delai."
            exit 1
          fi

          if grep -qi "traceback" "$log" 2>/dev/null; then
            echo "Traceback trouve dans les logs."
            exit 1
          fi

          port=$(ss -tlnp 2>/dev/null | grep "pid=$pid," | grep -oE '127\.0\.0\.1:[0-9]+' | head -1 | cut -d: -f2)
          if [ -z "$port" ]; then
            echo "Aucun port a l'ecoute trouve pour le PID $pid."
            exit 1
          fi
          echo "Serveur sur le port $port"

          curl -sf "http://127.0.0.1:$port/" | grep -q 'id="btn-supports"' \
            || { echo "btn-supports absent du HTML servi"; exit 1; }
          curl -sf "http://127.0.0.1:$port/api/matieres" > /dev/null \
            || { echo "/api/matieres a echoue"; exit 1; }

          kill "$pid"
          echo "OK : build Linux fonctionnel."

      - name: Publier le diagnostic si echec
        if: failure()
        run: |
          {
            echo "=== verify.log ==="
            cat /tmp/verify.log 2>/dev/null || echo "(absent)"
            echo "=== ps aux ==="
            ps aux | grep -i incipit || true
            echo "=== stdout/stderr ==="
            cat /tmp/stdout.log 2>/dev/null || echo "(absent)"
            echo "=== app.log ==="
            cat dist/Incipit/_internal/logs/app.log 2>/dev/null || echo "(absent)"
            echo "=== ldd ==="
            ldd dist/Incipit/Incipit 2>&1 || true
          } > /tmp/diag.txt
          mkdir -p /tmp/repo-diag && cd /tmp/repo-diag
          git init -q
          git config user.email ci@local
          git config user.name bot
          cp /tmp/diag.txt diag.txt
          git add -A
          git commit -q -m "diag linux"
          git push --force "https://x-access-token:${GITHUB_TOKEN}@github.com/${{ github.repository }}.git" HEAD:ci-debug-linux
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  macos:
    name: Build + lancer sur macOS
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5

      - name: Build (packaging/build_macos.sh)
        run: sh packaging/build_macos.sh

      - name: Lancer et verifier
        run: |
          set -e
          exec > /tmp/verify.log 2>&1
          binaire=$(find dist/Incipit.app -type f -name Incipit -perm -u+x | head -1)
          "$binaire" > /tmp/stdout.log 2>&1 &
          sleep 10

          pid=$(pgrep -x Incipit | head -1)
          log=$(find dist/Incipit.app -name app.log | head -1)

          if [ -z "$pid" ]; then
            echo "Le processus n'a pas demarre ou s'est arrete."
            exit 1
          fi

          if grep -qi "traceback" "$log" 2>/dev/null; then
            echo "Traceback trouve dans les logs."
            exit 1
          fi

          port=$(lsof -a -p "$pid" -iTCP -sTCP:LISTEN -n -P 2>/dev/null | grep -oE '127\.0\.0\.1:[0-9]+' | head -1 | cut -d: -f2)
          if [ -z "$port" ]; then
            echo "Aucun port a l'ecoute trouve pour le PID $pid."
            exit 1
          fi
          echo "Serveur sur le port $port"

          curl -sf "http://127.0.0.1:$port/" | grep -q 'id="btn-supports"' \
            || { echo "btn-supports absent du HTML servi"; exit 1; }
          curl -sf "http://127.0.0.1:$port/api/matieres" > /dev/null \
            || { echo "/api/matieres a echoue"; exit 1; }

          kill "$pid"
          echo "OK : build macOS fonctionnel."

      - name: Publier le diagnostic si echec
        if: failure()
        run: |
          {
            echo "=== verify.log ==="
            cat /tmp/verify.log 2>/dev/null || echo "(absent)"
            echo "=== ps aux ==="
            ps aux | grep -i incipit || true
            echo "=== stdout/stderr ==="
            cat /tmp/stdout.log 2>/dev/null || echo "(absent)"
            echo "=== app.log ==="
            find dist/Incipit.app -name app.log -exec cat {} \; 2>/dev/null || echo "(absent)"
          } > /tmp/diag.txt
          mkdir -p /tmp/repo-diag && cd /tmp/repo-diag
          git init -q
          git config user.email ci@local
          git config user.name bot
          cp /tmp/diag.txt diag.txt
          git add -A
          git commit -q -m "diag macos"
          git push --force "https://x-access-token:${GITHUB_TOKEN}@github.com/${{ github.repository }}.git" HEAD:ci-debug-macos
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
